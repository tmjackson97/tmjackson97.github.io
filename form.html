<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Visitor Survey</title>
    
    <style>
        body {
            background-color: whitesmoke; font-family: Arial, sans-serif;color: black;}

        form {width: 300px; margin: 30px auto;}

        label { display: block; margin-top: 10px;}

        select, input[type="text"], textarea { width: 100%; margin-top: 5px;}

        fieldset {margin-top: 15px; padding: 10px; border: 1px solid black;}

        legend {font-weight: bold;}

        textarea {background-color: white; color: black; margin-top: 10px; height: 100px;}

        .buttons {margin-top: 15px;}

        input[type="submit"] {background-color: blanchedalmond; color: black; padding: 5px 10px; border: none; cursor: pointer;}

        input[type="reset"] {background-color: blanchedalmond; color: black; padding: 5px 10px; border: none; cursor: pointer; margin-left: 10px;}
    </style>

</head>

<body>

    <form>
        <h2>Visitor Survey</h2>

        <a href="index.html" style="margin-right: 15px;">Home</a>
        <a href="table.html" style="margin-right: 15px;">Projects</a>
        <a href="https://www.linkedin.com/in/taylorjacksonnc/">Linkedin</a>
      

        <br><br>

        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" name="firstName">

        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" name="lastName">

        <label for="language">Select your job title:</label>
        <select id="language" name="language">
            <option value="js">Hiring Manager</option>
            <option value="python">Programmer</option>
            <option value="java">Cybersecurity Professional</option>
            <option value="csharp">Other</option>
        </select>

        <fieldset>
            <legend>Job Experience in Your Field</legend>

            <label><input type="radio" name="experience" value="0-2"> 0-2 years</label>
            <label><input type="radio" name="experience" value="3-5"> 3-5 years</label>
            <label><input type="radio" name="experience" value="6-10"> 6-10 years</label>
            <label><input type="radio" name="experience" value="10+"> 10+ years</label>

        </fieldset>

        <label for="comments">Please Give Your Thoughts and Opinions On my Resume and Experience</label>
        <textarea id="comments" name="comments" placeholder="Enter your comment here..."></textarea>

        <div class="buttons">
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </div>

    </form>

</body>
</html>
